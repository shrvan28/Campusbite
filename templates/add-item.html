{% extends "admin_base.html" %}

{% set active_page = "add_item" %}
{% block title %}Add Menu Item | CampusBite Admin{% endblock %}

{% block content %}
<h1 class="admin-title">Add New Menu Item</h1>

<div class="form-container">
    <form method="POST" action="/admin/add-item">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="name" placeholder="E.g., Samosa" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                <option value="">Select Category</option>
                <option value="breakfast">Breakfast & Snacks</option>
                <option value="tea">Tea & Coffee</option>
                <option value="drinks">Cold Drinks</option>
            </select>
        </div>

        <div class="form-group">
            <label>Price (&#8377;)</label>
            <input type="number" name="price" placeholder="E.g., 20" required min="1" step="0.01">
        </div>

        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="stock_quantity" placeholder="E.g., 40" required min="0" step="1" value="25">
        </div>

        <div class="form-group">
            <label>Image URL</label>
            <input type="url" name="image_url" placeholder="https://example.com/image.jpg" required>
        </div>

        <div class="form-group" style="display:flex; align-items:center; gap:15px;">
            <label style="margin-bottom:0;">Is Available?</label>
            <label class="switch">
                <input type="checkbox" name="is_available" checked>
                <span class="slider round"></span>
            </label>
        </div>

        <button type="submit" class="btn-submit">Add Item to Menu</button>
    </form>
</div>
{% endblock %}
